<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skyline Bookmarks - Aircraft Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── CSS Variables for Theming ── */
    :root {
      --primary-light: #60a5fa;
      --primary-dark: #3b82f6;
      --secondary: #93c5fd;
      --bg-light: #e0f2fe;
      --bg-dark: #0c1929;
      --surface-light: #ffffff;
      --surface-dark: #1a3a52;
      --surface-lighter: #f0f9ff;
      --surface-darker: #0f2844;
      --text-light: #1e293b;
      --text-dark: #e0f2fe;
      --muted-light: #64748b;
      --muted-dark: #7dd3fc;
      --border-light: rgba(0, 0, 0, 0.1);
      --border-dark: rgba(255, 255, 255, 0.1);
      --accent: #06b6d4;
      --f: 'Outfit', sans-serif;
      
      /* Active theme variables */
      --bg: var(--bg-dark);
      --surface: var(--surface-dark);
      --text: var(--text-dark);
      --muted: var(--muted-dark);
      --border: var(--border-dark);
      --accent-primary: var(--primary-light);
    }

    /* Light theme */
    :root[data-theme="light"] {
      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --text: var(--text-light);
      --muted: var(--muted-light);
      --border: var(--border-light);
      --accent-primary: var(--primary-dark);
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    html, body {
      height: 100%;
      font-family: var(--f);
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
    }

    /* ── Authentication State ── */
    body:not(.authenticated) > header,
    body:not(.authenticated) > main {
      display: none;
    }

    body.authenticated #auth-overlay {
      display: none;
    }

    /* ── Header ── */
    header {
      position: relative;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 25, 41, 0.95);
      backdrop-filter: blur(12px);
      height: 60px;
    }

    :root[data-theme="light"] header {
      background: rgba(255, 255, 255, 0.95);
    }

    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo::before {
      content: "✈️";
      font-size: 1.4rem;
    }

    .header-right {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      padding: 8px 12px;
      cursor: pointer;
      font-family: var(--f);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: var(--text);
      border-color: var(--accent-primary);
      background: var(--accent-primary);
      color: var(--bg);
    }

    .icon-btn.active {
      background: var(--accent-primary);
      color: var(--bg);
    }

    /* ── Main Content ── */
    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      gap: 16px;
      padding: 20px;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      overflow: hidden;
    }

    /* ── Card Base ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* ── Search Card ── */
    #search-card {
      flex-shrink: 0;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-ico {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }

    #search-input {
      width: 100%;
      background: var(--surface-darker);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--f);
      font-size: 0.95rem;
      padding: 12px 12px 12px 40px;
      outline: none;
      transition: all 0.2s;
    }

    #search-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
    }

    #search-input::placeholder {
      color: var(--muted);
    }

    /* ── Bookmarks Grid ── */
    #bookmarks-card {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 4px;
      align-content: start;
    }

    .bm-grid::-webkit-scrollbar {
      width: 6px;
    }

    .bm-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .bm-grid::-webkit-scrollbar-thumb {
      background: var(--accent-primary);
      border-radius: 3px;
    }

    /* ── Plane Bookmark Shapes ── */
    .bookmark {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      background: var(--surface-darker);
      border: 2px solid var(--accent-primary);
      transition: all 0.2s;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      min-height: 120px;
      position: relative;
      overflow: visible;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .plane-icon {
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      transition: transform 0.3s;
    }

    .bookmark:hover .plane-icon {
      transform: scale(1.15) rotate(-5deg);
    }

    .plane-icon svg {
      width: 100%;
      height: 100%;
      fill: var(--accent-primary);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .bm-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-align: center;
      color: var(--muted);
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .bookmark:hover {
      background: var(--surface);
      border-color: var(--secondary);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(96, 165, 250, 0.2);
    }

    .bookmark:hover .bm-label {
      color: var(--accent-primary);
    }

    .bookmark.edit-mode {
      animation: pulse 0.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .tile-action {
      position: absolute;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent-primary);
      border: 2px solid var(--bg);
      color: var(--bg);
      font-size: 11px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s;
    }

    .tile-delete { right: 4px; background: #ef4444; }
    .tile-edit { right: 32px; background: #3b82f6; }

    .bookmark.edit-mode .tile-action {
      display: flex;
      pointer-events: auto;
    }

    .tile-action:hover {
      transform: scale(1.15);
    }

    .add-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 16px 12px;
      border-radius: 8px;
      background: transparent;
      border: 2px dashed var(--accent-primary);
      color: var(--accent-primary);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--f);
      user-select: none;
      min-height: 120px;
    }

    .add-tile:hover {
      background: rgba(96, 165, 250, 0.05);
      border-color: var(--secondary);
    }

    .add-tile::before {
      content: "+";
      font-size: 2rem;
      line-height: 1;
    }

    /* ── Modals ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 380px;
      max-width: 90vw;
      max-height: 90vh;
      overflow-y: auto;
      animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .modal-close {
      background: var(--surface-darker);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      padding: 0;
      font-family: var(--f);
      font-weight: 500;
    }

    .modal-close:hover {
      color: var(--text);
      border-color: var(--accent-primary);
    }

    .form-field {
      width: 100%;
      background: var(--surface-darker);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--f);
      font-size: 0.9rem;
      padding: 12px;
      margin-bottom: 12px;
      outline: none;
      transition: all 0.2s;
    }

    .form-field:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
    }

    .form-field::placeholder {
      color: var(--muted);
    }

    .form-error {
      color: #ef4444;
      font-size: 0.8rem;
      margin-bottom: 12px;
      text-align: center;
    }

    .form-success {
      color: #10b981;
      font-size: 0.8rem;
      margin-bottom: 12px;
      text-align: center;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      color: var(--bg);
      font-family: var(--f);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(96, 165, 250, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--surface-darker);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--accent-primary);
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    /* ── Settings Panel ── */
    .settings-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 12px;
      background: var(--surface-darker);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .settings-label {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .settings-control {
      display: flex;
      gap: 8px;
    }

    .theme-toggle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--accent-primary);
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
    }

    .theme-toggle.active {
      background: var(--accent-primary);
    }

    select.form-field {
      cursor: pointer;
    }

    /* ── Auth Overlay ── */
    #auth-overlay {
      background: linear-gradient(135deg, var(--bg-dark), var(--surface-dark));
      backdrop-filter: none;
      animation: none;
    }

    .auth-modal {
      width: 420px;
      max-width: 90vw;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-header h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-header h1::before {
      content: "✈️";
      font-size: 2.2rem;
    }

    .auth-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: var(--f);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
    }

    .auth-content {
      display: none;
    }

    .auth-content.active {
      display: block;
    }

    .auth-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .auth-footer button {
      background: none;
      border: none;
      color: var(--accent-primary);
      cursor: pointer;
      font-weight: 600;
      font-family: var(--f);
    }

    .credit {
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .credit a {
      color: var(--accent-primary);
      text-decoration: none;
    }

    .credit a:hover {
      text-decoration: underline;
    }

    /* ── Utility Classes ── */
    .hidden {
      display: none !important;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      main {
        padding: 12px;
        gap: 12px;
      }

      .card {
        padding: 16px;
      }

      .bm-grid {
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      }

      header {
        padding: 0 16px;
        height: 50px;
      }

      .logo {
        font-size: 1.1rem;
      }

      .modal, .auth-modal {
        width: 95vw;
      }
    }
  </style>
</head>
<body data-theme="dark">

  <!-- ── Authentication Overlay ── -->
  <div class="overlay open" id="auth-overlay">
    <div class="modal auth-modal">
      <div class="auth-header">
        <h1>Skyline Bookmarks</h1>
        <p>Your personal flight deck</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <!-- Login Form -->
      <div class="auth-content active" id="login-content">
        <input class="form-field" id="login-username" type="text" placeholder="Username" autocomplete="username">
        <input class="form-field" id="login-password" type="password" placeholder="Password" autocomplete="current-password">
        <div id="login-error" class="form-error hidden"></div>
        <button class="btn" id="login-btn">Login</button>
        <p class="auth-footer">
          <span>Don't have an account? </span>
          <button id="switch-to-register">Register here</button>
        </p>
      </div>

      <!-- Register Form -->
      <div class="auth-content" id="register-content">
        <input class="form-field" id="register-username" type="text" placeholder="Username" autocomplete="username">
        <input class="form-field" id="register-password" type="password" placeholder="Password" autocomplete="new-password">
        <input class="form-field" id="register-confirm" type="password" placeholder="Confirm Password" autocomplete="new-password">
        <div id="register-error" class="form-error hidden"></div>
        <div id="register-success" class="form-success hidden"></div>
        <button class="btn" id="register-btn">Create Account</button>
        <p class="auth-footer">
          <span>Already have an account? </span>
          <button id="switch-to-login">Login here</button>
        </p>
      </div>

      <div class="credit">
        Design inspired by <a href="https://github.com/TyCoInnovations/portal" target="_blank">TyCo Bookmarks</a>
      </div>
    </div>
  </div>

  <!-- ── Main Header ── -->
  <header>
    <div class="logo">Skyline Bookmarks</div>
    <div class="header-right">
      <button class="icon-btn" id="toggle-edit">Edit</button>
      <button class="icon-btn" id="toggle-theme">🌙</button>
      <button class="icon-btn" id="open-settings">⚙️</button>
      <button class="icon-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <!-- ── Main Content ── -->
  <main>
    <div class="container">
      <!-- Search Card -->
      <div class="card" id="search-card">
        <div class="card-title">Quick Navigate</div>
        <div class="search-wrap">
          <span class="search-ico">🔍</span>
          <input id="search-input" type="text" placeholder="Search bookmarks..." autocomplete="off">
        </div>
      </div>

      <!-- Bookmarks Card -->
      <div class="card" id="bookmarks-card">
        <div class="card-title">Your Flight Path</div>
        <div class="bm-grid" id="bm-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- ── Add/Edit Bookmark Modal ── -->
  <div class="overlay" id="bookmark-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="bookmark-modal-title">Add Bookmark</div>
        <button class="modal-close" id="bookmark-close">✕</button>
      </div>
      <input class="form-field" id="bookmark-name" type="text" placeholder="Bookmark Name" maxlength="40">
      <input class="form-field" id="bookmark-url" type="url" placeholder="URL (e.g., https://github.com)">
      <select class="form-field" id="bookmark-plane">
        <option value="f111">F-111 (Small/Fast)</option>
        <option value="concorde">Concorde (Sleek)</option>
        <option value="747">Boeing 747 (Large)</option>
        <option value="a340">Airbus A340 (Cargo)</option>
        <option value="777">Boeing 777 (Wide-body)</option>
      </select>
      <div id="bookmark-error" class="form-error hidden"></div>
      <button class="btn" id="bookmark-save">Save Bookmark</button>
      <button class="btn btn-secondary" id="bookmark-cancel">Cancel</button>
    </div>
  </div>

  <!-- ── Settings Modal ── -->
  <div class="overlay" id="settings-overlay">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Settings</div>
        <button class="modal-close" id="settings-close">✕</button>
      </div>

      <div class="settings-group">
        <span class="settings-label">Theme</span>
        <div class="settings-control">
          <button class="theme-toggle" id="theme-dark" data-theme="dark" title="Dark Mode"></button>
          <button class="theme-toggle" id="theme-light" data-theme="light" title="Light Mode"></button>
        </div>
      </div>

      <div class="settings-group">
        <span class="settings-label">Display Name</span>
        <input class="form-field" id="settings-name" type="text" placeholder="Your name" maxlength="40" style="width: auto; flex: 1;">
      </div>

      <button class="btn" id="save-settings">Save Settings</button>
      <button class="btn btn-danger" id="clear-all-data">Clear All Data</button>

      <div class="credit" style="margin-top: 24px;">
        Design inspired by <a href="https://github.com/TyCoInnovations/portal" target="_blank">TyCo Bookmarks</a>
      </div>
    </div>
  </div>

  <script>
    // SVG Plane Icons
    const PLANE_ICONS = {
      f111: `<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <path d="M 50 5 L 30 25 L 25 20 L 50 10 L 75 20 L 70 25 Z" fill="currentColor"/>
        <rect x="48" y="25" width="4" height="25" fill="currentColor"/>
        <path d="M 50 50 L 35 55 L 40 50 Z" fill="currentColor"/>
        <path d="M 50 50 L 65 55 L 60 50 Z" fill="currentColor"/>
      </svg>`,
      
      concorde: `<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <path d="M 50 8 L 20 35 L 30 40 L 45 30 L 50 50 L 55 30 L 70 40 L 80 35 Z" fill="currentColor"/>
        <path d="M 48 50 L 50 55 L 52 50 Z" fill="currentColor"/>
      </svg>`,
      
      '747': `<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="28" rx="20" ry="12" fill="currentColor" opacity="0.8"/>
        <path d="M 30 28 L 20 25 L 20 31 Z" fill="currentColor"/>
        <path d="M 70 28 L 80 25 L 80 31 Z" fill="currentColor"/>
        <rect x="45" y="40" width="10" height="12" fill="currentColor"/>
        <circle cx="35" cy="52" r="3" fill="currentColor"/>
        <circle cx="50" cy="52" r="3" fill="currentColor"/>
        <circle cx="65" cy="52" r="3" fill="currentColor"/>
      </svg>`,
      
      a340: `<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="26" rx="22" ry="11" fill="currentColor" opacity="0.8"/>
        <path d="M 28 26 L 18 22 L 18 30 Z" fill="currentColor"/>
        <path d="M 72 26 L 82 22 L 82 30 Z" fill="currentColor"/>
        <rect x="44" y="37" width="12" height="13" fill="currentColor"/>
        <circle cx="30" cy="50" r="2.5" fill="currentColor"/>
        <circle cx="42" cy="50" r="2.5" fill="currentColor"/>
        <circle cx="58" cy="50" r="2.5" fill="currentColor"/>
        <circle cx="70" cy="50" r="2.5" fill="currentColor"/>
      </svg>`,
      
      '777': `<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="50" cy="27" rx="18" ry="10" fill="currentColor" opacity="0.8"/>
        <path d="M 32 27 L 22 24 L 22 30 Z" fill="currentColor"/>
        <path d="M 68 27 L 78 24 L 78 30 Z" fill="currentColor"/>
        <rect x="46" y="37" width="8" height="12" fill="currentColor"/>
        <circle cx="35" cy="49" r="3" fill="currentColor"/>
        <circle cx="50" cy="49" r="3" fill="currentColor"/>
        <circle cx="65" cy="49" r="3" fill="currentColor"/>
      </svg>`
    };

    const utils = {
      lsGet: (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } },
      lsSet: (key, val) => { try { localStorage.setItem(key, val); } catch(e) { console.error('LS write fail:', e); } },
      lsRemove: (key) => { try { localStorage.removeItem(key); } catch(e) {} },
      normalizeUrl: (url) => {
        url = (url || '').trim();
        if (!url) return '';
        if (/^https?:\/\//i.test(url)) return url;
        return 'https://' + url;
      }
    };

    const STORAGE_KEYS = { USER: 'skyline_user', BOOKMARKS: 'skyline_bookmarks', SETTINGS: 'skyline_settings', AUTH_TOKEN: 'skyline_auth_token' };

    const DEFAULT_BOOKMARKS = [
      { name: 'GitHub', url: 'https://github.com', plane: 'concorde' },
      { name: 'Google', url: 'https://google.com', plane: 'f111' },
      { name: 'YouTube', url: 'https://youtube.com', plane: '747' },
      { name: 'ChatGPT', url: 'https://chat.openai.com', plane: 'a340' },
      { name: 'Reddit', url: 'https://reddit.com', plane: '777' }
    ];

    let appState = {
      currentUser: null,
      bookmarks: [],
      settings: { theme: 'dark', displayName: 'Pilot' },
      editingIndex: -1,
      isEditMode: false,
      authToken: null
    };

    const DOM = {
      body: document.documentElement,
      authOverlay: document.getElementById('auth-overlay'),
      authTabs: document.querySelectorAll('.auth-tab'),
      authContents: document.querySelectorAll('.auth-content'),
      loginUsername: document.getElementById('login-username'),
      loginPassword: document.getElementById('login-password'),
      loginError: document.getElementById('login-error'),
      loginBtn: document.getElementById('login-btn'),
      registerUsername: document.getElementById('register-username'),
      registerPassword: document.getElementById('register-password'),
      registerConfirm: document.getElementById('register-confirm'),
      registerError: document.getElementById('register-error'),
      registerSuccess: document.getElementById('register-success'),
      registerBtn: document.getElementById('register-btn'),
      switchToRegister: document.getElementById('switch-to-register'),
      switchToLogin: document.getElementById('switch-to-login'),
      toggleEdit: document.getElementById('toggle-edit'),
      toggleTheme: document.getElementById('toggle-theme'),
      openSettings: document.getElementById('open-settings'),
      logoutBtn: document.getElementById('logout-btn'),
      searchInput: document.getElementById('search-input'),
      bmGrid: document.getElementById('bm-grid'),
      bookmarkOverlay: document.getElementById('bookmark-overlay'),
      bookmarkClose: document.getElementById('bookmark-close'),
      bookmarkModalTitle: document.getElementById('bookmark-modal-title'),
      bookmarkName: document.getElementById('bookmark-name'),
      bookmarkUrl: document.getElementById('bookmark-url'),
      bookmarkPlane: document.getElementById('bookmark-plane'),
      bookmarkError: document.getElementById('bookmark-error'),
      bookmarkSave: document.getElementById('bookmark-save'),
      bookmarkCancel: document.getElementById('bookmark-cancel'),
      settingsOverlay: document.getElementById('settings-overlay'),
      settingsClose: document.getElementById('settings-close'),
      settingsName: document.getElementById('settings-name'),
      themeDark: document.getElementById('theme-dark'),
      themeLight: document.getElementById('theme-light'),
      saveSettings: document.getElementById('save-settings'),
      clearAllData: document.getElementById('clear-all-data')
    };

    const auth = {
      register: async (username, password) => {
        if (!username || username.length < 3) throw new Error('Username must be at least 3 characters');
        if (!password || password.length < 6) throw new Error('Password must be at least 6 characters');
        const existing = utils.lsGet(`${STORAGE_KEYS.USER}_${username}`);
        if (existing) throw new Error('Username already exists');
        const userData = { username, password: btoa(password), createdAt: new Date().toISOString(), bookmarks: [...DEFAULT_BOOKMARKS] };
        utils.lsSet(`${STORAGE_KEYS.USER}_${username}`, JSON.stringify(userData));
        return userData;
      },
      login: async (username, password) => {
        const userData = utils.lsGet(`${STORAGE_KEYS.USER}_${username}`);
        if (!userData) throw new Error('Username not found');
        const user = JSON.parse(userData);
        if (user.password !== btoa(password)) throw new Error('Invalid password');
        const token = btoa(`${username}:${Date.now()}`);
        utils.lsSet(STORAGE_KEYS.AUTH_TOKEN, token);
        return user;
      },
      logout: () => {
        utils.lsRemove(STORAGE_KEYS.AUTH_TOKEN);
        appState.currentUser = null;
        appState.authToken = null;
        appState.bookmarks = [];
        ui.showAuthOverlay();
      },
      getCurrentUser: () => {
        const token = utils.lsGet(STORAGE_KEYS.AUTH_TOKEN);
        if (!token) return null;
        try {
          const decoded = atob(token).split(':');
          const username = decoded[0];
          const userData = utils.lsGet(`${STORAGE_KEYS.USER}_${username}`);
          return userData ? JSON.parse(userData) : null;
        } catch(e) { return null; }
      }
    };

    const bookmarks = {
      load: () => {
        if (!appState.currentUser) return;
        const saved = utils.lsGet(`${STORAGE_KEYS.USER}_${appState.currentUser.username}`);
        if (saved) {
          const user = JSON.parse(saved);
          appState.bookmarks = user.bookmarks || [...DEFAULT_BOOKMARKS];
        }
      },
      save: () => {
        if (!appState.currentUser) return;
        const userData = JSON.parse(utils.lsGet(`${STORAGE_KEYS.USER}_${appState.currentUser.username}`));
        userData.bookmarks = appState.bookmarks;
        utils.lsSet(`${STORAGE_KEYS.USER}_${appState.currentUser.username}`, JSON.stringify(userData));
      },
      add: (name, url, plane) => {
        url = utils.normalizeUrl(url);
        if (!name || !url) throw new Error('Name and URL are required');
        appState.bookmarks.push({ name, url, plane });
        bookmarks.save();
        ui.render();
      },
      update: (index, name, url, plane) => {
        if (index < 0 || index >= appState.bookmarks.length) throw new Error('Invalid bookmark');
        url = utils.normalizeUrl(url);
        appState.bookmarks[index] = { name, url, plane };
        bookmarks.save();
        ui.render();
      },
      delete: (index) => {
        if (index < 0 || index >= appState.bookmarks.length) throw new Error('Invalid bookmark');
        appState.bookmarks.splice(index, 1);
        bookmarks.save();
        ui.render();
      },
      search: (query) => {
        if (!query) return appState.bookmarks;
        const q = query.toLowerCase();
        return appState.bookmarks.filter(b => b.name.toLowerCase().includes(q) || b.url.toLowerCase().includes(q));
      }
    };

    const settings = {
      load: () => {
        const saved = utils.lsGet(STORAGE_KEYS.SETTINGS);
        if (saved) appState.settings = JSON.parse(saved);
      },
      save: () => { utils.lsSet(STORAGE_KEYS.SETTINGS, JSON.stringify(appState.settings)); },
      applyTheme: (theme) => {
        appState.settings.theme = theme;
        DOM.body.setAttribute('data-theme', theme);
        DOM.toggleTheme.textContent = theme === 'dark' ? '☀️' : '🌙';
        updateThemeButtons();
        settings.save();
      }
    };

    const ui = {
      showAuthOverlay: () => { document.body.classList.remove('authenticated'); DOM.authOverlay.classList.add('open'); },
      hideAuthOverlay: () => { document.body.classList.add('authenticated'); DOM.authOverlay.classList.remove('open'); },
      showBookmarkModal: (index = -1) => {
        appState.editingIndex = index;
        if (index >= 0) {
          const bm = appState.bookmarks[index];
          DOM.bookmarkModalTitle.textContent = 'Edit Bookmark';
          DOM.bookmarkName.value = bm.name;
          DOM.bookmarkUrl.value = bm.url;
          DOM.bookmarkPlane.value = bm.plane || 'concorde';
        } else {
          DOM.bookmarkModalTitle.textContent = 'Add Bookmark';
          DOM.bookmarkName.value = '';
          DOM.bookmarkUrl.value = '';
          DOM.bookmarkPlane.value = 'concorde';
        }
        clearBookmarkError();
        DOM.bookmarkOverlay.classList.add('open');
        DOM.bookmarkName.focus();
      },
      hideBookmarkModal: () => { DOM.bookmarkOverlay.classList.remove('open'); },
      showSettingsModal: () => { DOM.settingsName.value = appState.settings.displayName || ''; updateThemeButtons(); DOM.settingsOverlay.classList.add('open'); },
      hideSettingsModal: () => { DOM.settingsOverlay.classList.remove('open'); },
      render: () => {
        const query = DOM.searchInput.value.trim();
        const filtered = query ? bookmarks.search(query) : appState.bookmarks;
        DOM.bmGrid.innerHTML = '';
        filtered.forEach((bm, visIndex) => {
          const actualIndex = appState.bookmarks.indexOf(bm);
          const el = document.createElement('a');
          el.className = `bookmark${appState.isEditMode ? ' edit-mode' : ''}`;
          el.href = appState.isEditMode ? 'javascript:void(0)' : utils.normalizeUrl(bm.url);
          el.target = appState.isEditMode ? '' : '_blank';
          el.rel = 'noopener noreferrer';
          
          const planeIcon = PLANE_ICONS[bm.plane] || PLANE_ICONS.concorde;
          let html = `<div class="plane-icon">${planeIcon}</div><div class="bm-label">${escapeHtml(bm.name)}</div>`;
          
          if (appState.isEditMode) {
            html += `<button class="tile-action tile-edit" data-index="${actualIndex}" title="Edit">✏️</button><button class="tile-action tile-delete" data-index="${actualIndex}" title="Delete">✕</button>`;
          }
          
          el.innerHTML = html;
          el.addEventListener('click', (e) => { if (appState.isEditMode) e.preventDefault(); });
          DOM.bmGrid.appendChild(el);
        });
        if (!query) {
          const addBtn = document.createElement('button');
          addBtn.className = 'add-tile';
          addBtn.innerHTML = '<span>Add Bookmark</span>';
          addBtn.addEventListener('click', () => ui.showBookmarkModal());
          DOM.bmGrid.appendChild(addBtn);
        }
      },
      toggleEditMode: () => {
        appState.isEditMode = !appState.isEditMode;
        DOM.toggleEdit.classList.toggle('active');
        DOM.toggleEdit.textContent = appState.isEditMode ? '✓ Done' : 'Edit';
        ui.render();
      }
    };

    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function clearBookmarkError() { DOM.bookmarkError.classList.add('hidden'); DOM.bookmarkError.textContent = ''; }
    function showBookmarkError(msg) { DOM.bookmarkError.textContent = msg; DOM.bookmarkError.classList.remove('hidden'); }
    function clearRegisterError() { DOM.registerError.classList.add('hidden'); DOM.registerError.textContent = ''; DOM.registerSuccess.classList.add('hidden'); DOM.registerSuccess.textContent = ''; }
    function showRegisterError(msg) { clearRegisterError(); DOM.registerError.textContent = msg; DOM.registerError.classList.remove('hidden'); }
    function showRegisterSuccess(msg) { clearRegisterError(); DOM.registerSuccess.textContent = msg; DOM.registerSuccess.classList.remove('hidden'); }
    function showLoginError(msg) { DOM.loginError.textContent = msg; DOM.loginError.classList.remove('hidden'); }
    function updateThemeButtons() { DOM.themeDark.classList.toggle('active', appState.settings.theme === 'dark'); DOM.themeLight.classList.toggle('active', appState.settings.theme === 'light'); }

    function init() {
      settings.load();
      settings.applyTheme(appState.settings.theme);
      const user = auth.getCurrentUser();
      if (user) {
        appState.currentUser = user;
        appState.authToken = utils.lsGet(STORAGE_KEYS.AUTH_TOKEN);
        bookmarks.load();
        ui.hideAuthOverlay();
        ui.render();
        DOM.settingsName.value = appState.settings.displayName || '';
      } else {
        ui.showAuthOverlay();
      }

      DOM.authTabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const tabName = tab.dataset.tab;
          DOM.authTabs.forEach(t => t.classList.remove('active'));
          DOM.authContents.forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(`${tabName}-content`).classList.add('active');
        });
      });
      DOM.switchToRegister.addEventListener('click', () => DOM.authTabs[1].click());
      DOM.switchToLogin.addEventListener('click', () => DOM.authTabs[0].click());
      DOM.loginBtn.addEventListener('click', async () => {
        const username = DOM.loginUsername.value.trim();
        const password = DOM.loginPassword.value;
        try {
          const user = await auth.login(username, password);
          appState.currentUser = user;
          appState.authToken = utils.lsGet(STORAGE_KEYS.AUTH_TOKEN);
          bookmarks.load();
          settings.load();
          ui.hideAuthOverlay();
          ui.render();
        } catch(err) { showLoginError(err.message); }
      });
      DOM.loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') DOM.loginBtn.click(); });
      DOM.registerBtn.addEventListener('click', async () => {
        const username = DOM.registerUsername.value.trim();
        const password = DOM.registerPassword.value;
        const confirm = DOM.registerConfirm.value;
        clearRegisterError();
        if (password !== confirm) { showRegisterError('Passwords do not match'); return; }
        try {
          await auth.register(username, password);
          showRegisterSuccess('Account created! You can now login.');
          setTimeout(() => { DOM.switchToLogin.click(); DOM.loginUsername.value = username; DOM.loginPassword.focus(); }, 1500);
        } catch(err) { showRegisterError(err.message); }
      });
      DOM.registerConfirm.addEventListener('keydown', (e) => { if (e.key === 'Enter') DOM.registerBtn.click(); });
      DOM.toggleEdit.addEventListener('click', ui.toggleEditMode);
      DOM.toggleTheme.addEventListener('click', () => { const newTheme = appState.settings.theme === 'dark' ? 'light' : 'dark'; settings.applyTheme(newTheme); });
      DOM.openSettings.addEventListener('click', ui.showSettingsModal);
      DOM.logoutBtn.addEventListener('click', () => { if (confirm('Logout?')) auth.logout(); });
      DOM.searchInput.addEventListener('input', () => ui.render());
      DOM.bookmarkClose.addEventListener('click', ui.hideBookmarkModal);
      DOM.bookmarkCancel.addEventListener('click', ui.hideBookmarkModal);
      DOM.bookmarkSave.addEventListener('click', () => {
        const name = DOM.bookmarkName.value.trim();
        const url = DOM.bookmarkUrl.value.trim();
        const plane = DOM.bookmarkPlane.value;
        try {
          clearBookmarkError();
          if (!name) throw new Error('Name is required');
          if (!url) throw new Error('URL is required');
          if (appState.editingIndex >= 0) {
            bookmarks.update(appState.editingIndex, name, url, plane);
          } else {
            bookmarks.add(name, url, plane);
          }
          ui.hideBookmarkModal();
        } catch(err) { showBookmarkError(err.message); }
      });
      DOM.settingsClose.addEventListener('click', ui.hideSettingsModal);
      DOM.saveSettings.addEventListener('click', () => { appState.settings.displayName = DOM.settingsName.value.trim() || 'Pilot'; settings.save(); ui.hideSettingsModal(); });
      DOM.clearAllData.addEventListener('click', () => { if (confirm('This will delete ALL your data. Are you sure?')) { utils.lsRemove(`${STORAGE_KEYS.USER}_${appState.currentUser.username}`); auth.logout(); } });
      DOM.themeDark.addEventListener('click', () => settings.applyTheme('dark'));
      DOM.themeLight.addEventListener('click', () => settings.applyTheme('light'));
      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('tile-edit')) { const index = parseInt(e.target.dataset.index); ui.showBookmarkModal(index); }
        if (e.target.classList.contains('tile-delete')) { const index = parseInt(e.target.dataset.index); if (confirm('Delete this bookmark?')) { bookmarks.delete(index); } }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
