<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plane Themed Bookmarks ✈</title>

<link rel="icon" href="../images/favicon.png">

<style>
.bookmark{
    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.25),
        rgba(255,255,255,.08)
    );
    padding:20px;
    border-radius:25px;
    margin:18px 0;
    border:3px solid rgba(255,255,255,.25);
    box-shadow:
        0 10px 25px rgba(0,0,0,.35),
        inset 0 0 20px rgba(255,255,255,.15);
    position:relative;
    overflow:hidden;
}


.bookmark::before{
    content:"✈";
    position:absolute;
    right:15px;
    top:10px;
    font-size:45px;
    opacity:.15;
}


.bookmark h3{
    margin:0 0 10px;
    font-size:22px;
    color:#fff;
}


.bookmark a{
    color:#8ee7ff;
    word-break:break-all;
}


.actions{
    margin-top:15px;
    display:flex;
    gap:10px;
}


.edit{
    background:#ffb703;
    color:#222;
}
</style>

</head>


<body>


<header>

<div class="logo">
✈
</div>

<h1>
Plane Themed Bookmarks
</h1>

</header>



<div class="container">


<div class="card">

<h2>
🛫 Add Flight Bookmark
</h2>

<input id="name" placeholder="Website name">

<input id="url" placeholder="Website URL">

<button onclick="addBookmark()">
✈ Add Bookmark
</button>

</div>




<div class="card">

<h2>
📚 Saved Flights
</h2>

<div id="list">

</div>

</div>


</div>



<footer>

✈ Plane Themed Bookmarks Terminal<br>
planethemed.xyz/bookmarks

</footer>




<script>

let bookmarks =
JSON.parse(localStorage.getItem("planeBookmarks")) || [];


function save(){

localStorage.setItem(
"planeBookmarks",
JSON.stringify(bookmarks)
);

}



function addBookmark(){

let name=document.getElementById("name").value;
let url=document.getElementById("url").value;


if(!name || !url){
alert("Please enter a website!");
return;
}


if(!url.startsWith("http")){
url="https://"+url;
}


bookmarks.push({
name:name,
url:url
});


save();

document.getElementById("name").value="";
document.getElementById("url").value="";

display();

}



function removeBookmark(index){

bookmarks.splice(index,1);

save();

display();

}




function display(){

let list=document.getElementById("list");

list.innerHTML="";


if(bookmarks.length===0){

list.innerHTML=
"<p>No saved flights yet ✈</p>";

return;

}


bookmarks.forEach((b,i)=>{


list.innerHTML+=`

<div class="bookmark">

<h3>
🛩 ${b.name}
</h3>


<a href="${b.url}" target="_blank">
${b.url}
</a>


<div class="actions">

<button class="open"
onclick="window.open('${b.url}')">

Open Flight

</button>


<button class="delete"
onclick="removeBookmark(${i})">

Remove

</button>

</div>


</div>


`;


});


}


display();


</script>


</body>
</html>
