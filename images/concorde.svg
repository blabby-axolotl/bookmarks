<!-- Concorde top-down silhouette. Original artwork, released under CC0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
  <!-- Slender ogival delta wing + needle nose -->
  <!-- Fuselage needle -->
  <ellipse cx="50" cy="50" rx="3" ry="46"/>
  <!-- Ogival delta wings -->
  <polygon points="50,8 10,80 50,72 90,80"/>
  <!-- Rear horizontal stabiliser (small) -->
  <polygon points="50,90 38,100 50,96 62,100"/>
</svg>
