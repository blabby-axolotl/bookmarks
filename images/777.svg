<!-- Boeing 777 top-down silhouette. Original artwork, released under CC0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
  <!-- Fuselage (wide body twin) -->
  <ellipse cx="50" cy="50" rx="6.5" ry="43"/>
  <!-- Main swept wings -->
  <polygon points="50,44 4,66 50,61 96,66"/>
  <!-- 2 large engine pods (GE90-style, very large) -->
  <ellipse cx="27" cy="60" rx="6" ry="2.5"/>
  <ellipse cx="73" cy="60" rx="6" ry="2.5"/>
  <!-- Horizontal stabilisers -->
  <polygon points="50,87 27,97 50,93 73,97"/>
</svg>
