<!-- Airbus A340 top-down silhouette. Original artwork, released under CC0. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
  <!-- Fuselage (long and slender) -->
  <ellipse cx="50" cy="50" rx="5" ry="44"/>
  <!-- Main swept wings (long, gentle sweep) -->
  <polygon points="50,45 3,62 50,58 97,62"/>
  <!-- 4 engine pods -->
  <ellipse cx="20" cy="57" rx="4" ry="2"/>
  <ellipse cx="35" cy="53" rx="4" ry="2"/>
  <ellipse cx="65" cy="53" rx="4" ry="2"/>
  <ellipse cx="80" cy="57" rx="4" ry="2"/>
  <!-- Horizontal stabilisers -->
  <polygon points="50,88 30,98 50,93 70,98"/>
</svg>
